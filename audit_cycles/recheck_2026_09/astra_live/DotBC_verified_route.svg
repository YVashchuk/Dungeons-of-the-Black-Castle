<title id="title">DotBC — проверенный маршрут Астры V</title>
<desc id="description">Схема одного успешного прохождения: 68 параграфов объединены в 18 этапов. Барлад побеждён перед пробуждением Принцессы. Это не географическая карта. Содержит спойлеры. Переход 886 к 1044 отмечен как противоречие PL-28.</desc>
